<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connector Test Report</title>
<!-- Testing aid only: generated by connector_tests/run_connector_tests.py. Self-contained, no external resources. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dde1e8;
  --pass: #1a7f45; --pass-bg: #e3f5ea; --fail: #b42318; --fail-bg: #fde8e6; --skip: #6b7280; --skip-bg: #eef0f3;
  --warn: #a15c07; --warn-bg: #fdf1dc; --accent: #2f5bd3; --accent-bg: #e8eefc; --code-bg: #f1f3f6;
  --harness: #7c4dde; --harness-bg: #f2ecfd; --line: #9aa3b2;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --s-other: #9aa3b2; --grid: #eceff3;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418; --panel: #1a1f26; --text: #e6e9ee; --muted: #9aa3b2; --border: #2c333d;
    --pass: #4ade80; --pass-bg: #12301f; --fail: #f87171; --fail-bg: #3a1614; --skip: #9ca3af; --skip-bg: #252b33;
    --warn: #fbbf24; --warn-bg: #352708; --accent: #7aa2ff; --accent-bg: #1c2740; --code-bg: #141920;
    --harness: #b69cff; --harness-bg: #241c38; --line: #5d6677;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --s-other: #5d6677; --grid: #252b33;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 1.5rem; margin: 0 0 2px; }
h2 { font-size: 1.15rem; margin: 0 0 4px; }
.meta { color: var(--muted); font-size: .85rem; overflow-wrap: anywhere; }
.note { color: var(--muted); font-size: .8rem; margin: 2px 0 16px; }
.banner { padding: 12px 16px; border-radius: 10px; font-weight: 600; margin-bottom: 16px; }
.banner.ok { background: var(--pass-bg); color: var(--pass); }
.banner.bad { background: var(--fail-bg); color: var(--fail); }
.muted { color: var(--muted); }
code, pre, .mono { font: 12.5px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; overflow: auto;
  max-height: 460px; white-space: pre-wrap; overflow-wrap: anywhere; }

/* tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; font-weight: 600;
  padding: 10px 14px; cursor: pointer; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.count { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: var(--code-bg);
  color: var(--muted); font-size: .75rem; text-align: center; }
[role="tabpanel"][hidden] { display: none; }

/* tiles + controls */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .n { font-size: 1.7rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .l { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.tile.pass .n { color: var(--pass); } .tile.fail .n { color: var(--fail); } .tile.skip .n { color: var(--skip); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.controls button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 14px; font: inherit; cursor: pointer; }
.controls button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.controls input { flex: 1 1 200px; min-width: 0; background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px; font: inherit; }

/* results list */
.list { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.head, .list summary { display: grid; grid-template-columns: 70px minmax(0, 1.3fr) minmax(0, .7fr) minmax(0, 2.2fr) 70px;
  gap: 12px; align-items: center; padding: 10px 14px; }
.head { color: var(--muted); font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--border); }
.list details { border-bottom: 1px solid var(--border); } .list details:last-child { border-bottom: 0; }
.list summary { cursor: pointer; list-style: none; } .list summary::-webkit-details-marker { display: none; }
.list summary:hover { background: var(--code-bg); }
.badge { display: inline-block; font-size: .74rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; text-align: center; }
.badge.PASS { background: var(--pass-bg); color: var(--pass); } .badge.FAIL { background: var(--fail-bg); color: var(--fail); }
.badge.SKIP { background: var(--skip-bg); color: var(--skip); }
.name { font-weight: 600; overflow-wrap: anywhere; } .type, .dur { color: var(--muted); font-variant-numeric: tabular-nums; }
.reason { overflow-wrap: anywhere; } .cat { color: var(--muted); font-size: .8rem; }
.detail { padding: 4px 14px 16px; display: grid; gap: 10px; }
.label { font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 6px 0 4px; font-weight: 600; }
.why { padding: 10px 12px; border-radius: 8px; border-left: 4px solid var(--border); background: var(--code-bg); }
.why.pass { border-left-color: var(--pass); } .why.fail { border-left-color: var(--fail); } .why.expected { border-left-color: var(--warn); }
.linkbtn { background: none; border: 0; padding: 0; color: var(--accent); font: inherit; cursor: pointer; text-decoration: underline; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* cards (connections + pool) */
.cards { display: grid; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-bottom: 10px; }
.card-h .name { font-size: 1.02rem; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.kv { width: 100%; border-collapse: collapse; font-size: .88rem; }
.kv th, .kv td { text-align: left; vertical-align: top; padding: 5px 8px; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
.kv th { color: var(--muted); font-weight: 600; width: 38%; }
.kv td { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; }
.kv tr:last-child th, .kv tr:last-child td { border-bottom: 0; }
.objtype { display: inline-block; font-weight: 700; color: var(--accent); background: var(--accent-bg); border-radius: 6px; padding: 2px 8px; }
.card details > summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: .85rem; margin: 10px 0 6px; }
.grid-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.grid-table th, .grid-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; font-variant-numeric: tabular-nums; }
.grid-table th { color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; }
.table-wrap { overflow-x: auto; }
.pill { display: inline-block; font-size: .74rem; font-weight: 700; border-radius: 999px; padding: 1px 9px; }
.pill.yes { background: var(--pass-bg); color: var(--pass); } .pill.no { background: var(--fail-bg); color: var(--fail); }

/* flow charts */
.flow + .flow { margin-top: 36px; }
.flow-sub { color: var(--muted); margin: 0 0 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .8rem; color: var(--muted); margin-bottom: 16px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px;
  vertical-align: -2px; border: 2px solid var(--border); background: var(--panel); }
.legend .lg-decision::before { border: 2px dashed var(--accent); }
.legend .lg-harness::before { border-color: var(--harness); background: var(--harness-bg); }
.legend .lg-result::before { border-color: var(--pass); }
.legend .lg-terminal::before { border-radius: 999px; border-color: var(--text); }
.legend .lg-fail::before { border-color: var(--fail); background: var(--fail-bg); }
.terminal { margin: 0 auto; width: max-content; max-width: 100%; text-align: center; font-weight: 700; padding: 8px 22px;
  border: 2px solid var(--text); border-radius: 999px; background: var(--panel); }
.stage { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.stage-h { font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 10px; }
.step { border: 2px solid var(--border); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.step.decision { border-style: dashed; border-color: var(--accent); }
.step.harness { border-color: var(--harness); background: var(--harness-bg); }
.step.result { border-color: var(--pass); }
.step-t { font-weight: 600; }
.step-k { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-left: 6px; }
.step code { display: block; margin-top: 4px; color: var(--accent); overflow-wrap: anywhere; }
.step p { margin: 6px 0 0; color: var(--muted); font-size: .88rem; }
.facts { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 6px 12px; margin: 10px 0 0; font-size: .9rem; }
.facts dt { color: var(--muted); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .04em; padding-top: 2px; }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts dd.code { font: 12px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; color: var(--accent); }
.facts ul { margin: 0; padding-left: 18px; }
.facts ul.fails { padding-left: 0; margin: 0; }
.stage-sum { margin: -4px 0 12px; color: var(--muted); font-size: .9rem; }
.flow-how { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; font-size: .9rem; }
@media (max-width: 760px) { .facts { grid-template-columns: 1fr; } .facts dt { padding-top: 6px; } }
.fails { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; }
.fails li { font-size: .8rem; background: var(--fail-bg); color: var(--fail); border-radius: 6px; padding: 3px 8px; overflow-wrap: anywhere; }
.fails li::before { content: "\2715  "; font-weight: 700; }
.stops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.stop { font-size: .75rem; font-weight: 600; border-radius: 999px; padding: 2px 10px; cursor: help; }
.stop.pass { background: var(--pass-bg); color: var(--pass); }
.stop.expected { background: var(--warn-bg); color: var(--warn); }
.stop.fail { background: var(--fail-bg); color: var(--fail); }
.arrow { height: 24px; position: relative; }
.arrow::before { content: ""; position: absolute; left: 50%; top: 2px; bottom: 7px; border-left: 2px solid var(--line); }
.arrow::after { content: ""; position: absolute; left: calc(50% - 5px); bottom: 1px; border: 5px solid transparent;
  border-top: 7px solid var(--line); border-bottom: 0; }
.branches { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.branch { border: 1px dashed var(--border); border-radius: 10px; padding: 10px; min-width: 0; }
.branch-h { font-weight: 600; font-size: .85rem; margin-bottom: 8px; }

/* pool connections */
.tiles.wide { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
.headline { font-size: 1.02rem; margin: 0 0 12px; }
.timeline { position: relative; margin-top: 6px; }
.tl-axis { position: relative; height: 20px; margin-left: 64px; margin-right: 92px; color: var(--muted); font-size: .72rem; }
.tl-axis span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ev-table th:first-child, .ev-table td:first-child { white-space: normal; min-width: 180px; }
.ev-table th:not(:first-child), .ev-table td:not(:first-child) { white-space: nowrap; text-align: right; }
.tl-row { display: grid; grid-template-columns: 64px 1fr 92px; align-items: center; height: 26px; border-radius: 6px; }
.tl-row:hover { background: var(--code-bg); }
.tl-name { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; }
.tl-track { position: relative; height: 100%; }
.tl-grid { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--grid); }
.tl-wait { position: absolute; top: 50%; height: 0; border-top: 2px dotted var(--line); }
.tl-hold { position: absolute; top: 5px; bottom: 5px; border-radius: 4px; box-shadow: 0 0 0 2px var(--panel); }
.tl-label { color: var(--muted); font-size: .75rem; padding-left: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--muted); margin: 10px 0 4px; }
.tl-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; }
.tl-legend .wait-key { width: 18px; height: 0; border-radius: 0; border-top: 2px dotted var(--line); vertical-align: 3px; }
.tooltip { position: fixed; z-index: 10; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: .8rem; box-shadow: 0 4px 16px rgba(0,0,0,.15); max-width: 260px; }
.tooltip b { display: block; margin-bottom: 2px; }
@media (max-width: 760px) {
  .tl-axis { margin-left: 44px; margin-right: 0; }
  .tl-row { grid-template-columns: 44px 1fr; }
  .tl-label { display: none; }
  .tl-axis span.minor { display: none; }
  .tiles { grid-template-columns: repeat(2, 1fr); }
  .head { display: none; }
  .list summary { grid-template-columns: 60px minmax(0, 1fr) auto; }
  .list summary .type { display: none; }
  .list summary .reason { grid-column: 1 / -1; }
  .cols, .branches { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <h1>Connector Test Report</h1>
  <div class="meta" id="meta"></div>
  <div class="note">Testing aid only. Secrets are masked; env:// references are shown as references.</div>
  <div class="banner" id="banner"></div>

  <div class="tabs" role="tablist" aria-label="Report sections">
    <button role="tab" id="tab-tests" aria-controls="panel-tests" aria-selected="true">Tests &amp; results<span class="count" id="c-tests"></span></button>
    <button role="tab" id="tab-connections" aria-controls="panel-connections" aria-selected="false" tabindex="-1">Connections<span class="count" id="c-connections"></span></button>
    <button role="tab" id="tab-pool" aria-controls="panel-pool" aria-selected="false" tabindex="-1">Connection pool<span class="count" id="c-pool"></span></button>
    <button role="tab" id="tab-poolconn" aria-controls="panel-poolconn" aria-selected="false" tabindex="-1">Pool connections<span class="count" id="c-poolconn"></span></button>
    <button role="tab" id="tab-flow" aria-controls="panel-flow" aria-selected="false" tabindex="-1">Flow charts<span class="count" id="c-flow"></span></button>
  </div>

  <section role="tabpanel" id="panel-tests" aria-labelledby="tab-tests">
    <div class="tiles" id="tiles"></div>
    <div class="controls" role="toolbar" aria-label="Filter tests">
      <button data-filter="ALL" aria-pressed="true">All</button>
      <button data-filter="PASS" aria-pressed="false">Pass</button>
      <button data-filter="FAIL" aria-pressed="false">Fail</button>
      <button data-filter="SKIP" aria-pressed="false">Skip</button>
      <input id="search" type="search" placeholder="Search name or type" aria-label="Search tests">
    </div>
    <div class="list">
      <div class="head"><span>Status</span><span>Name</span><span>Type</span><span>Reason</span><span>Duration</span></div>
      <div id="rows"></div>
      <div class="empty" id="empty" hidden>No tests match.</div>
    </div>
  </section>

  <section role="tabpanel" id="panel-connections" aria-labelledby="tab-connections" hidden>
    <div class="cards" id="connections"></div>
  </section>

  <section role="tabpanel" id="panel-pool" aria-labelledby="tab-pool" hidden>
    <div class="cards" id="pools"></div>
  </section>

  <section role="tabpanel" id="panel-poolconn" aria-labelledby="tab-poolconn" hidden>
    <div class="tiles wide" id="run-tiles"></div>
    <div class="cards" id="poolconns"></div>
    <div class="tooltip" id="tooltip" role="status" hidden></div>
  </section>

  <section role="tabpanel" id="panel-flow" aria-labelledby="tab-flow" hidden>
    <div id="flows"></div>
  </section>
</main>

<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  const data = JSON.parse(document.getElementById("data").textContent);
  const results = data.results || [];
  const flows = data.flows || {};
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  };
  const json = (v) => JSON.stringify(v, null, 2);
  const attrs = (x) => (x && typeof x === "object" && x.attributes) ? x.attributes : (x || {});
  const fmt = (v) => (v === null || v === undefined) ? "—" : (typeof v === "object" ? JSON.stringify(v) : String(v));
  const succeeded = (r) => r.status === "PASS" && r.category === "ok";
  const outcome = (r) => r.status === "SKIP" ? "skip" : succeeded(r) ? "pass" : r.status === "PASS" ? "expected" : "fail";

  // ---- header ----------------------------------------------------------------------------
  const s = data.summary;
  document.getElementById("meta").textContent = "Generated " + data.generated_at + " · " + data.config;
  const banner = document.getElementById("banner");
  const allOk = s.failed === 0 && s.total > 0;
  banner.className = "banner " + (allOk ? "ok" : "bad");
  banner.textContent = allOk ? "All tests passed (" + s.passed + " of " + s.total + ")" : s.failed + " of " + s.total + " tests failed";

  // ---- tabs ------------------------------------------------------------------------------
  const tabs = Array.from(document.querySelectorAll('[role="tab"]'));
  const select = (tab, focus) => {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    });
    if (focus) tab.focus();
    history.replaceState(null, "", "#" + tab.id.replace("tab-", ""));
  };
  tabs.forEach((t, i) => {
    t.addEventListener("click", () => select(t));
    t.addEventListener("keydown", (e) => {
      const d = e.key === "ArrowRight" ? 1 : e.key === "ArrowLeft" ? -1 : 0;
      if (d) { e.preventDefault(); select(tabs[(i + d + tabs.length) % tabs.length], true); }
    });
  });
  const goTo = (name, anchorId) => {
    select(document.getElementById("tab-" + name));
    if (anchorId) { const a = document.getElementById(anchorId); if (a) a.scrollIntoView({ behavior: "smooth", block: "start" }); }
  };
  const initial = document.getElementById("tab-" + location.hash.slice(1));
  if (initial) select(initial);

  // ---- tab 1: tests & results -------------------------------------------------------------
  document.getElementById("c-tests").textContent = String(s.total);
  const tiles = document.getElementById("tiles");
  [["Total", s.total, ""], ["Passed", s.passed, "pass"], ["Failed", s.failed, "fail"], ["Skipped", s.skipped, "skip"]].forEach(([l, n, c]) => {
    const t = el("div", "tile " + c); t.append(el("div", "n", String(n)), el("div", "l", l)); tiles.append(t);
  });
  const whyText = (r) => {
    const o = outcome(r);
    if (o === "pass") return "PASS: connected, the object type matched and the health check succeeded. " + r.reason;
    if (o === "expected") return "PASS: this negative test was expected to fail, and it failed the right way. " + r.reason;
    if (o === "skip") return "SKIPPED: " + r.reason;
    return "FAIL (" + r.category + "): " + r.reason;
  };
  const block = (label, content) => {
    const w = el("div"); w.append(el("div", "label", label));
    w.append(typeof content === "string" ? el("pre", null, content) : content); return w;
  };
  const rows = document.getElementById("rows");
  results.forEach(r => {
    const d = el("details"); d.dataset.status = r.status; d.dataset.search = (r.name + " " + (r.type || "")).toLowerCase();
    if (r.status === "FAIL") d.open = true;
    const sum = el("summary");
    const reason = el("span", "reason", r.reason); reason.append(el("div", "cat", r.category));
    sum.append(el("span", "badge " + r.status, r.status), el("span", "name", r.name), el("span", "type", r.type || "—"),
               reason, el("span", "dur", r.duration_s.toFixed(2) + "s"));
    const body = el("div", "detail");
    body.append(el("div", "why " + outcome(r), whyText(r)));
    body.append(block("Expectation", json(r.expect)));
    if (r.health_check) body.append(block("Health check", json(r.health_check)));
    if (r.traceback) body.append(block("Traceback", r.traceback));
    const links = el("div");
    const toConn = el("button", "linkbtn", "Connection details"); toConn.type = "button";
    toConn.addEventListener("click", () => goTo("connections", "conn-" + r.name));
    const toFlow = el("button", "linkbtn", "Where it stopped in the flow chart"); toFlow.type = "button";
    toFlow.addEventListener("click", () => goTo("flow", "flow-" + r.type));
    links.append(toConn);
    if (flows[r.type]) { links.append(document.createTextNode(" · ")); links.append(toFlow); }
    body.append(links);
    d.append(sum, body); rows.append(d);
  });
  let filter = "ALL";
  const search = document.getElementById("search");
  const apply = () => {
    const q = search.value.trim().toLowerCase(); let shown = 0;
    rows.querySelectorAll("details").forEach(d => {
      const vis = (filter === "ALL" || d.dataset.status === filter) && (!q || d.dataset.search.includes(q));
      d.hidden = !vis; if (vis) shown++;
    });
    document.getElementById("empty").hidden = shown > 0;
  };
  document.querySelectorAll("[data-filter]").forEach(b => b.addEventListener("click", () => {
    filter = b.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    apply();
  }));
  search.addEventListener("input", apply);
  apply();

  // ---- tab 2: connections -----------------------------------------------------------------
  const kvTable = (obj) => {
    const t = el("table", "kv"); const tb = el("tbody");
    const entries = Object.entries(obj || {});
    if (!entries.length) { const tr = el("tr"); tr.append(el("td", "muted", "—")); tb.append(tr); }
    entries.forEach(([k, v]) => { const tr = el("tr"); tr.append(el("th", null, k), el("td", null, fmt(v))); tb.append(tr); });
    t.append(tb); return t;
  };
  const cardHead = (r) => {
    const h = el("div", "card-h");
    h.append(el("span", "badge " + r.status, r.status), el("span", "name", r.name), el("span", "muted", r.type || ""));
    return h;
  };
  const connHost = document.getElementById("connections");
  const ran = results.filter(r => r.status !== "SKIP");
  document.getElementById("c-connections").textContent = String(ran.filter(r => r.connection_object).length);
  ran.forEach(r => {
    const card = el("article", "card"); card.id = "conn-" + r.name; card.append(cardHead(r));
    const cols = el("div", "cols");
    const left = el("div");
    left.append(el("div", "label", "Connection info: config"), kvTable(r.connection_info.config));
    left.append(el("div", "label", "Connection info: credentials"), kvTable(r.connection_info.credentials));
    const right = el("div");
    right.append(el("div", "label", "How it was called"), kvTable(r.factory));
    cols.append(left, right); card.append(cols);
    card.append(el("div", "label", "Returned connection object"));
    const o = r.connection_object;
    if (o) {
      card.append(el("span", "objtype", o.type));
      card.append(block("repr", o.repr));
      const top = {}; const nested = {};
      Object.entries(o.attributes || {}).forEach(([k, v]) => { (v && typeof v === "object" ? nested : top)[k] = v; });
      card.append(block("Attributes", kvTable(top)));
      Object.entries(nested).forEach(([k, v]) => {
        const det = el("details"); if (k === "info") det.open = true;
        det.append(el("summary", null, k + (v && v.type ? "  (" + v.type + ")" : "")));
        det.append(v && v.attributes ? kvTable(v.attributes) : el("pre", null, json(v)));
        card.append(det);
      });
    } else {
      card.append(el("div", "why " + outcome(r), "No object returned: " + r.reason));
    }
    connHost.append(card);
  });
  if (!ran.length) connHost.append(el("div", "empty", "No tests ran."));

  // ---- tab 3: connection pool ---------------------------------------------------------------
  const poolHost = document.getElementById("pools");
  const pooled = results.filter(r => r.pool);
  document.getElementById("c-pool").textContent = String(pooled.length);
  const POOL_FIELDS = ["min_size", "max_size", "checkout_timeout", "max_lifetime", "idle_timeout", "health_check_interval", "on_exhausted", "shutdown_timeout"];
  pooled.forEach(r => {
    const p = r.pool; const card = el("article", "card"); card.append(cardHead(r));
    if (p.error) card.append(el("div", "why fail", "Pool check failed: " + p.error));
    const snaps = (p.checkouts || []).flatMap(c => [c.stats_during, c.stats_after_return]).filter(Boolean);
    const first = (snaps[0] || [])[0];
    if (first) {
      const key = attrs(first.identity); const cfg = attrs(key.pool_config);
      const cols = el("div", "cols");
      const left = el("div"); left.append(el("div", "label", "Pool identity (PoolKey)"));
      left.append(kvTable({ connector_type: key.connector_type, tenant_id: key.tenant_id, credential_fingerprint: key.credential_fingerprint,
                            config_identity: key.config_identity }));
      const right = el("div"); right.append(el("div", "label", "Pool configuration"));
      const cfgRows = {}; POOL_FIELDS.forEach(f => { if (f in cfg) cfgRows[f] = cfg[f]; });
      right.append(kvTable(cfgRows));
      cols.append(left, right); card.append(cols);
    }
    card.append(el("div", "label", "Checkouts (" + (p.context_method || "connection") + "())"));
    const wrap = el("div", "table-wrap"); const t = el("table", "grid-table");
    const thead = el("thead"); const hr = el("tr");
    ["#", "Object", "Same as #1", "Health check", "During checkout: in use / idle / total", "After return: in use / idle / total"].forEach(h => hr.append(el("th", null, h)));
    thead.append(hr); t.append(thead);
    const tb = el("tbody");
    const counts = (snap) => {
      const st = snap && snap[0] ? attrs(snap[0].stats) : null;
      return st ? st.in_use + " / " + st.idle + " / " + st.total : "—";
    };
    (p.checkouts || []).forEach(c => {
      const tr = el("tr");
      const same = el("td"); same.append(el("span", "pill " + (c.same_as_first ? "yes" : "no"), c.n === 1 ? "—" : c.same_as_first ? "reused" : "new"));
      if (c.n === 1) same.firstChild.className = "muted";
      const hc = c.health_check ? (c.health_check.ok ? "ok: " : "failed: ") + c.health_check.call : "—";
      tr.append(el("td", null, String(c.n)), el("td", "mono", c.object_type), same, el("td", "mono", hc),
                el("td", null, counts(c.stats_during)), el("td", null, counts(c.stats_after_return)));
      tb.append(tr);
    });
    t.append(tb); wrap.append(t); card.append(wrap);
    if (p.reused !== undefined) {
      card.append(el("div", "why " + (p.reused ? "pass" : "expected"),
        p.reused ? "The pool handed the same connection back on the next checkout, so connections are being reused."
                 : "Each checkout got a new connection (e.g. the previous one was discarded on return)."));
    }
    const raw = el("details"); raw.append(el("summary", null, "Raw pool data")); raw.append(el("pre", null, json(p))); card.append(raw);
    poolHost.append(card);
  });
  if (!pooled.length) poolHost.append(el("div", "empty", "No pool data: no test connected with a pool_probe configured."));

  // ---- tab: pool connections ---------------------------------------------------------------
  (function () {
    const count = (name) => results.reduce((n, r) => n + (r.events || []).filter(e => e.name === name).length, 0);
    const probes = results.filter(r => r.concurrency);
    document.getElementById("c-poolconn").textContent = String(count("connection.established"));
    const served = probes.reduce((n, r) => n + (r.concurrency.served || 0), 0);
    const users = probes.reduce((n, r) => n + (r.concurrency.users || 0), 0);
    const runTiles = document.getElementById("run-tiles");
    [["Postgres connections opened (whole run)", count("connection.established"), "pass"],
     ["Failed connection attempts", count("connection.failed"), count("connection.failed") ? "fail" : ""],
     ["Pooled checkouts", count("pool.checkout"), ""],
     ["Concurrent users served", users ? served + " / " + users : "—", users && served === users ? "pass" : users ? "fail" : ""]
    ].forEach(([l, n, c]) => { const t = el("div", "tile " + c); t.append(el("div", "n", String(n)), el("div", "l", l)); runTiles.append(t); });

    const host = document.getElementById("poolconns");
    const tip = document.getElementById("tooltip");
    const showTip = (ev, lines) => {
      tip.replaceChildren(); tip.append(el("b", null, lines[0])); lines.slice(1).forEach(l => tip.append(el("div", null, l)));
      tip.hidden = false;
      const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      const y = Math.min(ev.clientY + 14, window.innerHeight - tip.offsetHeight - 8);
      tip.style.left = x + "px"; tip.style.top = y + "px";
    };
    const hideTip = () => { tip.hidden = true; };

    probes.forEach(r => {
      const c = r.concurrency;
      const card = el("article", "card");
      const h = el("div", "card-h"); h.append(el("span", "badge " + r.status, r.status), el("span", "name", r.name), el("span", "muted", r.type || ""));
      card.append(h);
      if (c.error) { card.append(el("div", "why fail", "Concurrent users probe failed: " + c.error)); host.append(card); return; }
      const reused = c.served - c.distinct_connections;
      card.append(el("p", "headline",
        c.users + " users asked for a connection at the same moment. The pool" + (c.pool_max_size ? " (max_size " + c.pool_max_size + ")" : "") +
        " served " + (c.served === c.users ? "all " + c.served : c.served + " of " + c.users) + " of them using " + c.distinct_connections +
        " Postgres connection" + (c.distinct_connections === 1 ? "" : "s") + "." +
        (reused > 0 ? " " + reused + " users waited (up to " + Math.round(c.max_wait_ms) + " ms) and got a connection another user had just returned." : "")));
      const tiles = el("div", "tiles wide");
      [["Users", c.users, ""], ["Served", c.served, c.failed ? "fail" : "pass"], ["Postgres connections used", c.distinct_connections, ""],
       ["Pool max_size", c.pool_max_size ?? "—", ""], ["Peak in use", c.peak_in_use ?? "—", ""],
       ["Server sessions seen", c.max_server_sessions ?? "—", ""], ["Longest wait", c.max_wait_ms != null ? Math.round(c.max_wait_ms) + " ms" : "—", ""]
      ].forEach(([l, n, cl]) => { const t = el("div", "tile " + cl); t.append(el("div", "n", String(n)), el("div", "l", l)); tiles.append(t); });
      card.append(tiles);

      // colour follows the connection (identity), assigned in first-use order; beyond 8 folds into "other"
      const conns = Object.keys(c.users_by_connection || {});
      const color = {}; conns.forEach((k, i) => { color[k] = i < 8 ? "var(--s" + (i + 1) + ")" : "var(--s-other)"; });
      const keyOf = (row) => String(row[c.connection_key] ?? "");
      const rows = (c.rows || []).filter(x => !x.error);
      const total = Math.max(1, ...rows.map(x => x.start_ms + x.wait_ms + x.hold_ms));
      const pct = (ms) => (100 * ms / total) + "%";

      card.append(el("div", "label", "Timeline: when each user waited and held a connection"));
      const legend = el("div", "tl-legend");
      conns.slice(0, 8).forEach(k => { const s = el("span"); const i = el("i"); i.style.background = color[k]; s.append(i, document.createTextNode(c.connection_key + " " + k)); legend.append(s); });
      if (conns.length > 8) { const s = el("span"); const i = el("i"); i.style.background = "var(--s-other)"; s.append(i, document.createTextNode("other connections")); legend.append(s); }
      const wk = el("span"); wk.append(el("i", "wait-key"), document.createTextNode("waiting for a free connection")); legend.append(wk);
      card.append(legend);

      const tl = el("div", "timeline"); tl.setAttribute("role", "img");
      tl.setAttribute("aria-label", c.users + " users served by " + c.distinct_connections + " connections over " + Math.round(total) + " ms; see the table below.");
      const axis = el("div", "tl-axis"); const step = total > 2000 ? 500 : total > 800 ? 200 : 100;
      const ticks = []; for (let t = 0; t <= total; t += step) ticks.push(t);
      ticks.forEach((t, i) => { const s = el("span", i % 2 ? "minor" : null, t + " ms"); s.style.left = pct(t); axis.append(s); });
      tl.append(axis);
      rows.slice().sort((a, b) => a.user - b.user).forEach(x => {
        const row = el("div", "tl-row");
        row.append(el("div", "tl-name", "user " + x.user));
        const track = el("div", "tl-track");
        ticks.forEach(t => { const g = el("div", "tl-grid"); g.style.left = pct(t); track.append(g); });
        if (x.wait_ms > 0) { const w = el("div", "tl-wait"); w.style.left = pct(x.start_ms); w.style.width = pct(x.wait_ms); track.append(w); }
        const bar = el("div", "tl-hold"); bar.style.left = pct(x.start_ms + x.wait_ms); bar.style.width = pct(x.hold_ms);
        bar.style.background = color[keyOf(x)] || "var(--s-other)"; track.append(bar);
        row.append(track, el("div", "tl-label", c.connection_key + " " + keyOf(x)));
        const lines = ["User " + x.user, c.connection_key + ": " + keyOf(x), "waited " + Math.round(x.wait_ms) + " ms, held " + Math.round(x.hold_ms) + " ms",
                       "pool in use at checkout: " + (x.in_use_at_checkout ?? "—"), "server sessions: " + (x.server_sessions ?? "—")];
        row.addEventListener("mousemove", ev => showTip(ev, lines)); row.addEventListener("mouseleave", hideTip);
        tl.append(row);
      });
      card.append(tl);

      card.append(el("div", "label", "Postgres connections and the users each one served"));
      const t1 = el("table", "grid-table"); const th1 = el("tr");
      ["", c.connection_key, "Users served", "Count"].forEach(x => th1.append(el("th", null, x))); const hd1 = el("thead"); hd1.append(th1); t1.append(hd1);
      const tb1 = el("tbody");
      conns.forEach(k => {
        const tr = el("tr"); const sw = el("td"); const i = el("i"); i.style.cssText = "display:inline-block;width:12px;height:12px;border-radius:3px;background:" + color[k]; sw.append(i);
        const list = c.users_by_connection[k];
        tr.append(sw, el("td", "mono", k), el("td", null, list.map(u => "user " + u).join(", ")), el("td", null, String(list.length))); tb1.append(tr);
      });
      t1.append(tb1); const w1 = el("div", "table-wrap"); w1.append(t1); card.append(w1);

      const det = el("details"); det.append(el("summary", null, "Per-user table (" + (c.rows || []).length + " users)"));
      const cols = ["user", "start_ms", "wait_ms", "hold_ms", "in_use_at_checkout", ...Object.keys((c.rows || [])[0] || {}).filter(k => !["user", "start_ms", "wait_ms", "hold_ms", "in_use_at_checkout"].includes(k))];
      const t2 = el("table", "grid-table"); const th2 = el("tr"); cols.forEach(x => th2.append(el("th", null, x))); const hd2 = el("thead"); hd2.append(th2); t2.append(hd2);
      const tb2 = el("tbody");
      (c.rows || []).forEach(x => { const tr = el("tr"); cols.forEach(k => tr.append(el("td", "mono", fmt(x[k])))); tb2.append(tr); });
      t2.append(tb2); const w2 = el("div", "table-wrap"); w2.append(t2); det.append(w2); card.append(det);
      host.append(card);
    });

    // SDK events per test: how many connections each test opened
    const evCard = el("article", "card"); evCard.append(el("div", "label", "SDK events per test (from the connector's telemetry hooks)"));
    const EVENT_LABELS = {
      "connection.established": "Postgres connections opened", "connection.failed": "Connection attempts failed",
      "auth.authenticated": "Credentials obtained", "auth.refreshed": "Credentials refreshed",
      "pool.checkout": "Pooled checkouts", "pool.return": "Returned to the pool",
      "pool.recycled": "Closed by the pool (stale, unhealthy or shutdown)", "pool.exhausted": "Pool exhausted / timed out",
      "connection.health_check": "Health checks", "pool.closed": "Pools closed", "connector.closed": "Connectors closed",
    };
    const order = Object.keys(EVENT_LABELS);
    const names = [...new Set(results.flatMap(r => (r.events || []).map(e => e.name)))]
      .sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99) || a.localeCompare(b));
    const withEvents = results.filter(r => r.events);
    if (names.length) {
      const t = el("table", "grid-table ev-table"); const hr = el("tr"); hr.append(el("th", null, "Event"));
      withEvents.forEach(r => hr.append(el("th", null, r.name)));
      const hd = el("thead"); hd.append(hr); t.append(hd); const tb = el("tbody");
      names.forEach(n => {
        const tr = el("tr"); const label = el("td"); label.append(el("div", null, EVENT_LABELS[n] || n), el("div", "cat mono", n)); tr.append(label);
        withEvents.forEach(r => tr.append(el("td", null, String((r.events || []).filter(e => e.name === n).length || "—"))));
        tb.append(tr);
      });
      t.append(tb); const w = el("div", "table-wrap"); w.append(t); evCard.append(w);
    } else {
      evCard.append(el("div", "muted", "No events recorded (set defaults.event_hook)."));
    }
    host.append(evCard);
    if (!probes.length) host.prepend(el("div", "empty", "No concurrent-users probe ran (add concurrency_probe to a test's overrides)."));
  })();

  // ---- tab 4: flow charts -----------------------------------------------------------------
  const regex = (src) => { try { return new RegExp(src); } catch (e) { return null; } };
  const allSteps = (flow) => (flow.stages || []).flatMap(st => (st.branches || [{ steps: st.steps }]).flatMap(b => b.steps || []));
  const stopStep = (flow, r) => {
    if (r.status === "SKIP") return null;
    for (const step of allSteps(flow)) {
      for (const rule of step.stop || []) {
        if (rule.success) { if (succeeded(r)) return step.id; continue; }
        if (succeeded(r)) continue;
        if (rule.category && rule.category !== r.category) continue;
        if (rule.reason) { const re = regex(rule.reason); if (!re || !re.test(r.reason)) continue; }
        return step.id;
      }
    }
    return null;
  };
  const arrow = () => { const a = el("div", "arrow"); a.setAttribute("aria-hidden", "true"); return a; };
  const KIND = { decision: "decision", harness: "test harness", result: "returns" };
  const renderStep = (step, stops) => {
    const card = el("div", "step " + (step.kind || "step"));
    const t = el("div", "step-t", step.title || step.id);
    if (KIND[step.kind]) t.append(el("span", "step-k", KIND[step.kind]));
    card.append(t);
    const dl = el("dl", "facts");
    const row = (label, value, cls) => {
      if (value == null || (Array.isArray(value) && !value.length) || value === "") return;
      dl.append(el("dt", null, label));
      const dd = el("dd", cls || null);
      if (Array.isArray(value)) {
        const ul = el("ul", cls === "fail-list" ? "fails" : null); value.forEach(v => ul.append(el("li", null, v))); dd.append(ul);
      } else { dd.textContent = value; }
      dl.append(dd);
    };
    row("What it does", step.does || step.detail);
    row("Input", step.input);
    row("Output", step.output);
    row("If it fails", step.fails, "fail-list");
    row("Good to know", step.notes);
    row("In code", step.code, "code");
    if (dl.children.length) card.append(dl);
    const here = stops[step.id] || [];
    if (here.length) {
      const box = el("div", "stops");
      here.forEach(r => {
        const o = outcome(r);
        const label = (r.status === "PASS" ? "✓ " : "✕ ") + r.name +
          (o === "expected" ? " stopped here (expected)" : o === "pass" ? " finished" : " stopped here");
        const b = el("span", "stop " + o, label); b.title = r.reason; box.append(b);
      });
      card.append(box);
    }
    return card;
  };
  const renderSteps = (steps, stops) => {
    const w = el("div"); (steps || []).forEach((st, i) => { if (i) w.append(arrow()); w.append(renderStep(st, stops)); }); return w;
  };
  const flowHost = document.getElementById("flows");
  const flowTypes = Object.keys(flows);
  document.getElementById("c-flow").textContent = String(flowTypes.length);
  flowTypes.forEach(type => {
    const flow = flows[type]; const stops = {};
    results.filter(r => r.type === type).forEach(r => { const id = stopStep(flow, r); if (id) (stops[id] = stops[id] || []).push(r); });
    const sec = el("section", "flow"); sec.id = "flow-" + type;
    sec.append(el("h2", null, (flow.title || type) + ": how a connection begins and ends"));
    if (flow.summary) sec.append(el("p", "flow-sub", flow.summary));
    const legend = el("div", "legend");
    [["lg-terminal", "start / end"], ["", "step"], ["lg-decision", "decision"], ["lg-result", "returns to caller"],
     ["lg-harness", "test harness only"], ["lg-fail", "failure exit"]].forEach(([c, t]) => legend.append(el("span", c, t)));
    sec.append(legend);
    const how = el("div", "flow-how");
    how.textContent = "How to read a box: “What it does” explains the step in plain words, “Input” is what goes in, " +
      "“Output” is what comes out and is passed to the next box, “If it fails” lists what can go wrong and the " +
      "error you will see, and “In code” is the matching call for developers. Hover a badge to see that test's exact reason.";
    sec.append(how);
    sec.append(el("div", "terminal", flow.start || "Start"), arrow());
    (flow.stages || []).forEach((stage, i) => {
      if (i) sec.append(arrow());
      const st = el("div", "stage"); st.append(el("div", "stage-h", stage.title || ""));
      if (stage.summary) st.append(el("p", "stage-sum", stage.summary));
      if (stage.branches) {
        const grid = el("div", "branches");
        stage.branches.forEach(b => {
          const lane = el("div", "branch"); lane.append(el("div", "branch-h", b.title || "")); lane.append(renderSteps(b.steps, stops)); grid.append(lane);
        });
        st.append(grid);
      } else {
        st.append(renderSteps(stage.steps, stops));
      }
      sec.append(st);
    });
    sec.append(arrow(), el("div", "terminal", flow.end || "End"));
    flowHost.append(sec);
  });
  if (!flowTypes.length) flowHost.append(el("div", "empty", "No flow chart defined for the connector types in this run (see connector_tests/flows.yaml)."));
})();
</script>
