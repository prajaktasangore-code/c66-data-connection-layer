[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-connectors"
version = "0.1.0"
description = "Enterprise Connection SDK: secure configuration, authentication, pooling and lifecycle for native enterprise source connections."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
oauth = ["requests>=2.32"]
aws = ["boto3>=1.34"]
yaml = ["pyyaml>=6.0"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_connectors"]

# The source archive ships only what is needed to build the package: no tests, harness, docs, reports or secrets.
[tool.hatch.build.targets.sdist]
include = ["/src/enterprise_connectors", "/pyproject.toml", "/README.md", "/LICENSE"]  # leading / = repo root only
exclude = [".env", ".env.*", "**/test_reports", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
markers = ["integration: requires a live or controlled source system"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.isort]
known-first-party = ["enterprise_connectors", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]
# embedded HTML/CSS template lines; S105 flags the "secret not resolved" category label
"connector_tests/**" = ["S101", "S105", "E501"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["psycopg", "psycopg.*", "boto3", "requests", "yaml"]
ignore_missing_imports = true
